<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- MechFlow preference pack: SOLIDWORKS-style navigation, units and view keys.
     Apply via Edit > Preferences > General > Preference packs. -->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="General">
          <FCText Name="AutoloadModule">MechFlowWorkbench</FCText>
        </FCParamGroup>
        <FCParamGroup Name="View">
          <!-- SolidWorks navigation style ships with FreeCAD 1.1+. On 1.0 pick
               "Revit" or "OpenCascade" manually under Preferences > Navigation. -->
          <FCText Name="NavigationStyle">Gui::SolidWorksNavigationStyle</FCText>
          <FCBool Name="ZoomAtCursor" Value="1"/>
          <FCBool Name="ShowNaviCube" Value="1"/>
          <FCInt Name="CornerNaviCube" Value="1"/>
        </FCParamGroup>
        <FCParamGroup Name="Units">
          <!-- 0 = Standard (mm, kg, s, degrees) -->
          <FCInt Name="UserSchema" Value="0"/>
          <FCInt Name="Decimals" Value="2"/>
        </FCParamGroup>
        <FCParamGroup Name="Shortcut">
          <FCText Name="Std_ViewFront">Ctrl+1</FCText>
          <FCText Name="Std_ViewRear">Ctrl+2</FCText>
          <FCText Name="Std_ViewLeft">Ctrl+3</FCText>
          <FCText Name="Std_ViewRight">Ctrl+4</FCText>
          <FCText Name="Std_ViewTop">Ctrl+5</FCText>
          <FCText Name="Std_ViewBottom">Ctrl+6</FCText>
          <FCText Name="Std_ViewIsometric">Ctrl+7</FCText>
          <FCText Name="Std_ViewFitAll">F</FCText>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
