<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MechFlow Section View: a block with its front corner cut away -->
  <!-- remaining block -->
  <polygon points="10,22 32,10 54,22 54,46 32,58 10,46" fill="#4f84c4"/>
  <polygon points="10,22 32,10 54,22 32,34" fill="#8fb6e6"/>
  <polygon points="32,34 54,22 54,46 32,58" fill="#2f5f99"/>
  <!-- cut-away faces (section colour) -->
  <polygon points="10,22 32,34 32,46 10,34" fill="#f4a43c"/>
  <polygon points="32,34 32,46 21,52 21,40" fill="#f7c27a"/>
  <!-- section plane outline -->
  <polygon points="4,28 26,16 26,48 4,60" fill="none" stroke="#e07b00" stroke-width="2.5"
           stroke-linejoin="round" stroke-dasharray="4 3"/>
  <!-- edges -->
  <polyline points="10,22 32,10 54,22 54,46 32,58 32,34 54,22" fill="none"
            stroke="#1d3c63" stroke-width="2" stroke-linejoin="round"/>
</svg>
